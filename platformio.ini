; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=4
build_unflags = -DCORE_DEBUG_LEVEL=0
build_src_flags = -std=gnu++17
monitor_speed = 115200
upload_speed = 115200
test_ignore = gtests/*
lib_deps = 
	waspinator/AccelStepper@^1.64.0
	mathieucarbou/AsyncTCP @ ^3.2.1
	mathieucarbou/ESPAsyncWebServer @ ^3.6.0
	bblanchon/ArduinoJson @ ^7.0.0
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

[env:google_tests]
platform = native
test_framework = googletest
test_build_src = yes
test_filter = 
	gtests/test_domain
	gtests/test_motor
	gtests/test_storage
	gtests/test_time
	gtests/test_input
	gtests/test_audio
build_src_filter = -<*> +<domain/> +<platform/motor/> +<platform/storage/> +<platform/time/> +<platform/input/> +<platform/audio/>
build_flags = 
	-std=gnu++17
	-I test/mocks
	-I src
	--coverage
	-lgcov
lib_deps = 
	google/googletest@^1.15.2
