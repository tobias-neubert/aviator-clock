; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = lib

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=4
build_unflags = -DCORE_DEBUG_LEVEL=0
build_src_flags = -std=gnu++17
framework = arduino
monitor_speed = 115200
upload_speed = 115200
test_ignore = 
	gtests/*
	unity-tests/*
lib_ignore = 
	arduino-mock
	soc-mock
lib_deps = 
	waspinator/AccelStepper@^1.64.0
	mathieucarbou/AsyncTCP @ ^3.2.1
	mathieucarbou/ESPAsyncWebServer @ ^3.6.0
	bblanchon/ArduinoJson @ ^7.0.0

board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv




[env:unity_tests]
platform = native
test_framework = unity
test_filter = unity-tests/test_soc-esp32
build_src_filter = -<*>
build_flags = -std=gnu++17
lib_ignore = soc-mock, soc-esp32
lib_deps = 

[env:google_tests]
platform = native
test_framework = googletest
test_filter = 
	gtests/test_AccelStepperMotor
	gtests/test_ClockHand
	gtests/test_AlarmRepository
build_src_filter = -<*>
build_flags = 
	-std=gnu++17
	-I test/mocks
lib_ignore = 
	arduino-mock
	soc-esp32
lib_deps = 
	google/googletest@^1.15.2
	soc-mock
	buttons
	accel-stepper-adapter
	aviator-clock
	wifi-manager
